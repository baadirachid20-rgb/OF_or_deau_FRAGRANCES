<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر العطور الفاخرة</title>
    <style>
        /* إعدادات عامة للصفحة */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        
        /* تصميم الهيدر (الفوق ديال الموقع) */
        header {
            background-color: #1a252f;
            color: white;
            text-align: center;
            padding: 25px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2rem;
        }
        header p {
            margin: 10px 0 0 0;
            color: #bdc3c7;
        }

        /* حاوية المنتجات (باش يجيو حدا بعضياتهم) */
        .products-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        /* الكارطة ديال كل عطر */
        .product-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            width: 320px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            border: 1px solid #eee;
        }
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }

        /* تصميم التصويرة */
        .product-image {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-bottom: 2px solid #f9f9f9;
        }

        /* المعلومات ديال العطر الثمن والسمية */
        .product-info {
            padding: 25px 20px;
        }
        .product-title {
            font-size: 1.4rem;
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-weight: bold;
        }
        .product-price {
            color: #e74c3c;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* زر الطلب */
        .buy-button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .buy-button:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

    <header>
        <h1>متجر العطور الفاخرة</h1>
        <p>أفضل العطور الأصلية بأثمنة مناسبة - التوصيل متوفر</p>
    </header>

    <div class="products-container">
        
        <!-- العطر الأول -->
        <div class="product-card">
            <img src="perfume1.jpeg" alt="عطر الأناقة" class="product-image">
            <div class="product-info">
                <h3 class="product-title">عطر الأناقة</h3>
                <div class="product-price">199 درهم</div>
                <button class="buy-button">اطلب الآن</button>
            </div>
        </div>

        <!-- العطر الثاني -->
        <div class="product-card">
            <img src="perfume2.jpeg" alt="عطر الجاذبية" class="product-image">
            <div class="product-info">
                <h3 class="product-title">عطر الجاذبية</h3>
                <div class="product-price">249 درهم</div>
                <button class="buy-button">اطلب الآن</button>
            </div>
        </div>

        <!-- العطر الثالث -->
        <div class="product-card">
            <img src="perfume3.jpeg" alt="عطر الفخامة" class="product-image">
            <div class="product-info">
                <h3 class="product-title">عطر الفخامة</h3>
                <div class="product-price">299 درهم</div>
                <button class="buy-button">اطلب الآن</button>
            </div>
        </div>

    </div>

</body>
</html>
